<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>宝可梦肉鸽 · 联机冒险</title>
  <style>
    @font-face { font-family: 'emerald'; src: url('/fonts/pokemon-emerald-pro.ttf') format('truetype'); }
    @font-face { font-family: 'pkmnems'; src: url('/fonts/pkmnems.ttf') format('truetype'); }
    html, body { margin: 0; width: 100%; height: 100%; background: #111; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    #app { width: 100%; flex: 1; min-height: 0; }
    #coop-play-overlay { order: -1; flex: none; z-index: 20; pointer-events: none;
      font: 12px/1.35 "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; color: #fff; }
    #coop-play-overlay .panel { pointer-events: auto; display: flex; align-items: center;
      flex-wrap: wrap; gap: 3px 10px; padding: 4px 10px; background: rgba(8, 12, 24, .9);
      border-bottom: 1px solid rgba(120, 140, 180, .25); box-shadow: 0 2px 10px rgba(0, 0, 0, .35);
      max-width: 100%; box-sizing: border-box; }
    #coop-play-overlay h1 { font-size: 13px; font-weight: 600; margin: 0; white-space: nowrap; }
    #coop-play-overlay .row { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    #coop-play-overlay button, #coop-play-overlay input { font: inherit; padding: 2px 8px;
      min-height: 22px; border-radius: 4px; border: 1px solid #4d5b73; background: #1d2636; color: #f2f5fa; }
    #coop-play-overlay button { cursor: pointer; }
    #coop-play-overlay button:hover { background: #26334a; }
    #coop-play-overlay button.primary { background: #2d6cdf; border-color: #4b86ee; }
    #coop-play-overlay button.primary:hover { background: #3a7bec; }
    #coop-play-overlay .status, #coop-play-overlay .error { min-width: 0; overflow-wrap: anywhere; }
    #coop-play-overlay .status { color: #c3ccda; }
    #coop-play-overlay .error { color: #ffaaaa; }
    #coop-play-overlay .hidden { display: none; }
    #desktopControls { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px; padding: 3px; flex: none; }
    #desktopControls button { padding: 2px 7px; min-height: 22px; font: 12px/1.2 system-ui, sans-serif; }
    @media (max-width: 820px) {
      #coop-play-overlay .panel { gap: 2px 6px; padding: 3px 6px; }
      #coop-play-overlay h1 { font-size: 12px; }
      #coop-play-overlay .status { font-size: 11px; }
    }
  </style>
  <script>window.__COOP_PLAY__ = true;</script>
</head>
<body>
  <aside id="game-loading" role="status" style="position:fixed;inset:0;z-index:2000;background:#111b2b;color:white;display:grid;place-content:center;font:16px system-ui">正在加载冒险，请稍候…</aside>
  <div id="app"></div>
  <nav id="desktopControls" aria-label="原游戏控制">
    <button data-desktop-key="UP" aria-label="向上">↑</button><button data-desktop-key="DOWN" aria-label="向下">↓</button>
    <button data-desktop-key="LEFT" aria-label="向左">←</button><button data-desktop-key="RIGHT" aria-label="向右">→</button>
    <button data-desktop-key="ACTION">确认 Enter</button><button data-desktop-key="SUBMIT">完成选队 C</button><button data-desktop-key="CANCEL">返回 Esc</button>
    <span style="color:#d8deea;font:12px system-ui">WASD 移动 · 鼠标点击菜单选择</span>
    <button type="button" data-app-route="/">返回大厅</button>
  </nav>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
