name: Verify early foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Type check
        run: npm run typecheck
      - name: Local save regression tests
        run: npm run test:local-save
      - name: Cooperative battle and socket regression tests
        run: npm run test:coop
      - name: Original battle rule compatibility tests
        run: npm run test:battle-core
      - name: Upstream localization compatibility tests
        run: npm run test:localization
      - name: Build game and save manager
        run: npm run build
